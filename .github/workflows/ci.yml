name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU inference runtime
        if: matrix.python-version == '3.12'
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install HOJ service dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip install -r requirements-hoj.txt -e ".[dev,hoj]"

      - name: Run Python 3.11 CLI tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/ --ignore=tests/hoj -v --tb=short --cov=learning_os --cov-report=term --cov-report=xml

      - name: Run CLI and HOJ tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          python -m pytest tests/ -v --tb=short --cov=learning_os --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
