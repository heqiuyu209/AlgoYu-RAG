[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-os"
version = "1.0.0"
description = "Learning OS — personal knowledge operating system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "learning-os", email = "dev@learning-os.local"}
]
keywords = ["knowledge-base", "rag", "learning", "personal-km"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyyaml>=6.0",
    "typer>=0.15",
    "pymupdf>=1.25",
    "sentence-transformers>=3.4",
    "qdrant-client>=1.13",
    "anthropic>=0.50",
    "openai>=1.0",
]

[project.optional-dependencies]
hoj = [
    "transformers==5.20.2",
    "onnxruntime==1.31.0",
    "pypdf==6.21.1",
    "PyMuPDF==1.28.0",
    "pypdfium2==5.14.0",
    "Pillow==13.0.0",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.3",
    "av==19.0.1",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.28,<0.29",
]

[project.scripts]
los = "learning_os.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
